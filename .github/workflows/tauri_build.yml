name: Publish Release
on:
  push:
    branches: '*'
  workflow_dispatch:
  pull_request:
    branches: '*'
concurrency:
  cancel-in-progress: true
  # we want to group based on the push type not the ref
  group: ${{ github.ref_type }}
env:
  APP_NAME: "Music Caster"

jobs:
  # Resolves the app version (tauri.conf.json -> app/package.json) and decides whether this
  # build should be released: only if that version is higher than the latest published release.
  # The release body is the CHANGELOG entry for the version chained with the entries below it
  # down to the last x.y.0 (see build.py get_release_notes). A missing CHANGELOG entry is NOT
  # fatal here (branches/PRs keep building) - publish-release fails on the empty body instead.
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Set up Python
        uses: actions/setup-python@main

      - name: Compare version with latest release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python build.py --app-version)
          latest=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name || echo v0.0.0)
          latest=${latest#v}
          echo "App version: $version, latest release: $latest"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if python -c "import sys; parse = lambda v: tuple(map(int, v.split('.'))); sys.exit(0 if parse(sys.argv[1]) > parse(sys.argv[2]) else 1)" "$version" "$latest"; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build changelog
        id: build_changelog
        if: ${{ steps.version.outputs.should_release == 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          changelog=$(python build.py --release-notes)
          {
            echo 'changelog<<EOF'
            echo "$changelog"
            echo EOF
          } >> "$GITHUB_OUTPUT"
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
      changelog: ${{ steps.build_changelog.outputs.changelog }}

  bootstrapper:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './bootstrapper -> target'

      - name: Build bootstrapper
        run: |
          cd bootstrapper
          cargo build --release --target x86_64-pc-windows-msvc

      - name: Upload unsigned bootstrapper
        uses: actions/upload-artifact@main
        with:
          name: bootstrapper-unsigned-x64
          path: bootstrapper/target/x86_64-pc-windows-msvc/release/MusicCasterBootstrapper.exe

  # SSL.com's actions-codesigner is a Docker action, so all signing runs on
  # Linux runners (CodeSignTool is Java-based and signs Windows PE/MSI fine).
  # Signing is delegated to the reusable codesign.yml workflow, called with
  # `secrets: inherit` so the SSL.com credentials are declared in exactly one place.
  # Only sign on master pushes and release tags; other branches / PRs still
  # build (unsigned) so CI keeps validating them without burning signing quota.
  sign-bootstrapper:
    needs: [bootstrapper]
    if: ${{ github.ref == 'refs/heads/master' || github.ref_type == 'tag' }}
    uses: ./.github/workflows/codesign.yml
    secrets: inherit
    with:
      download_artifact: bootstrapper-unsigned-x64
      upload_artifact: windows-bootstrapper-x64

  # Build the daemon sidecar on its own so it can be code-signed on a Linux
  # runner before Tauri embeds it into the installer (externalBin). Built on
  # windows-11-arm for aarch64 because PyInstaller produces host-arch binaries.
  # matrix.args is `--target <triple>`; build.py names the artifact
  # dist/music-caster-daemon-<triple>.exe to match Tauri's externalBin lookup.
  build-daemon:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
            arch: x86_64-pc-windows-msvc
          - platform: 'windows-11-arm'
            args: '--target aarch64-pc-windows-msvc'
            arch: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Set up Python
        uses: actions/setup-python@main
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up venv and install Python dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install --upgrade-strategy eager -r requirements.txt -r requirements-dev.txt

      - name: Build Music Caster daemon
        run: |
          .venv\Scripts\python build.py --ci --no-install ${{ matrix.args }}

      - name: Upload unsigned daemon
        uses: actions/upload-artifact@main
        with:
          name: daemon-unsigned-${{ matrix.arch }}
          path: dist/music-caster-daemon-${{ matrix.arch }}.exe

  sign-daemon:
    needs: [build-daemon]
    if: ${{ github.ref == 'refs/heads/master' || github.ref_type == 'tag' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    uses: ./.github/workflows/codesign.yml
    secrets: inherit
    with:
      download_artifact: daemon-unsigned-${{ matrix.arch }}
      upload_artifact: daemon-signed-${{ matrix.arch }}

  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # - platform: 'macos-latest' # for Arm based macs (M1 and above).
          #   args: '--target aarch64-apple-darwin'
          # - platform: 'macos-latest' # for Intel based macs.
          #   args: '--target x86_64-apple-darwin'
          # build on oldest distro to increase AppImage robustness/compatibility
          # https://v2.tauri.app/distribute/appimage/#limitations
          # - platform: 'ubuntu-22.04'
          #   args: ''
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
            arch: x86_64-pc-windows-msvc
          - platform: 'windows-11-arm'
            args: '--target aarch64-pc-windows-msvc'
            arch: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    needs: [changelog, build-daemon, sign-daemon]
    # sign-daemon is skipped off master/tags; still build (with the unsigned
    # daemon) as long as the changelog and daemon build succeeded.
    if: ${{ always() && needs.changelog.result == 'success' && needs.build-daemon.result == 'success' && needs.sign-daemon.result != 'failure' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Install pnpm
        uses: pnpm/action-setup@master
        with:
          package_json_file: "app/package.json"

      - name: Setup Node.js
        uses: actions/setup-node@main
        with:
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
          node-version-file: app/.nvmrc

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.platform == 'windows-latest' && 'aarch64-pc-windows-msvc,x86_64-pc-windows-msvc' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './app/src-tauri -> target'
          key: ${{ matrix.arch }}

      - name: Install Ubuntu dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt update
          xargs sudo apt install -y < environment/apt_packages.txt
          sudo apt-get install -y xdg-utils --fix-missing

      - name: Install frontend dependencies
        run: |
          cd app
          pnpm install

      # On master/tags, pull in the code-SIGNED daemon so Tauri bundles the
      # signed sidecar into the installers. On other branches the signing jobs
      # are skipped, so fall back to the unsigned daemon just to keep CI building.
      # Both land at dist/music-caster-daemon-<triple>.exe for externalBin.
      - name: Download signed daemon
        if: ${{ github.ref == 'refs/heads/master' || github.ref_type == 'tag' }}
        uses: actions/download-artifact@main
        with:
          name: daemon-signed-${{ matrix.arch }}
          path: dist

      - name: Download unsigned daemon
        if: ${{ !(github.ref == 'refs/heads/master' || github.ref_type == 'tag') }}
        uses: actions/download-artifact@main
        with:
          name: daemon-unsigned-${{ matrix.arch }}
          path: dist

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          prerelease: false
          args: ${{ matrix.args }}

      # Upload unsigned installers so the Linux signing job can pick them up.
      # Nothing is attached to a release here: publish-release runs last and only
      # ever uploads the signed installers.
      - name: Windows Artifacts
        if: ${{ matrix.platform == 'windows-latest' || matrix.platform == 'windows-11-arm' }}
        uses: actions/upload-artifact@main
        with:
          name: installers-unsigned-${{ matrix.arch }}
          path: |
            app/src-tauri/target/${{ matrix.arch }}/release/bundle/msi/*.msi
            app/src-tauri/target/${{ matrix.arch }}/release/bundle/nsis/*.exe

      - name: macOS Artifacts
        if: ${{ matrix.platform == 'macos-latest' }}
        uses: actions/upload-artifact@main
        with:
          name: macOS Installer
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/app/*.app

      - name: Linux Artifacts
        if: ${{ startsWith(matrix.platform, 'ubuntu') }}
        uses: actions/upload-artifact@main
        with:
          name: Linux Distributions
          path: |
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/AppImage/*.AppImage

  build-rpm:
    runs-on: ubuntu-latest
    # pinned: the RPM runs on this glibc and newer, not older
    container: fedora:43
    env:
      TARGET_TRIPLE: x86_64-unknown-linux-gnu
      # promoted to job env so the signing steps can test for their presence:
      # the secrets context is not available in a step-level `if`
      RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
      RPM_GPG_PASSPHRASE: ${{ secrets.RPM_GPG_PASSPHRASE }}
    steps:
      # git is needed before checkout; tar/xz/which by actions/setup-node
      - name: Install system dependencies
        run: |
          set -eux
          dnf install -y \
            git tar xz gzip findutils which \
            gcc gcc-c++ make \
            openssl-devel \
            curl wget file \
            webkit2gtk4.1-devel \
            gtk3-devel \
            libsoup3-devel \
            librsvg2-devel \
            libappindicator-gtk3-devel \
            rpm-build rpmdevtools \
            python3 python3-pip python3-devel \
            portaudio-devel \
            patchelf \
            desktop-file-utils

      - name: Checkout repository
        uses: actions/checkout@main

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './app/src-tauri -> target'
          key: fedora-rpm

      # the daemon must exist before the Tauri build picks it up as externalBin
      - name: Set up venv and install Python dependencies
        run: |
          set -eux
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install --upgrade-strategy eager -r requirements.txt -r requirements-dev.txt

      - name: Build Music Caster daemon
        run: |
          set -eux
          .venv/bin/python build.py --ci --no-install --target "$TARGET_TRIPLE"
          # fail here instead of as a confusing missing externalBin later
          test -x "dist/music-caster-daemon-${TARGET_TRIPLE}"

      - name: Install pnpm
        uses: pnpm/action-setup@master
        with:
          package_json_file: "app/package.json"

      - name: Setup Node.js
        uses: actions/setup-node@main
        with:
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
          node-version-file: app/.nvmrc

      - name: Install frontend dependencies
        run: |
          cd app
          pnpm install

      - name: Build RPM
        run: |
          set -eux
          cd app
          # rpm only; the other tauri.conf.json targets belong to the release job.
          # createUpdaterArtifacts is off here: the updater cannot use an RPM, but
          # leaving it on makes Tauri demand TAURI_SIGNING_PRIVATE_KEY and fail
          # after bundling, which would also break forks that have no secrets.
          pnpm tauri build --bundles rpm --target "$TARGET_TRIPLE" \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Inspect the built RPM
        run: |
          set -eux
          rpm_path=$(find "app/src-tauri/target/${TARGET_TRIPLE}/release/bundle/rpm" -name '*.rpm' | head -n1)
          test -n "$rpm_path"
          echo "RPM_PATH=$rpm_path" >> "$GITHUB_ENV"
          echo "--- metadata ---"; rpm -qip "$rpm_path"
          echo "--- requires ---"; rpm -qpR "$rpm_path"
          echo "--- payload ---";  rpm -qlp "$rpm_path"

      # Tauri has no RPM signing support, so sign with rpmsign after bundling.
      - name: Sign RPM
        if: ${{ env.RPM_GPG_PRIVATE_KEY != '' }}
        run: |
          set -eu
          dnf install -y rpm-sign gnupg2
          printf '%s' "$RPM_GPG_PRIVATE_KEY" | gpg --batch --import
          key_id=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
          test -n "$key_id"
          pass_file=$(mktemp)
          printf '%s' "${RPM_GPG_PASSPHRASE:-}" > "$pass_file"
          # rpmsign shells out to gpg, which needs loopback pinentry to take a
          # passphrase without a tty
          rpmsign --addsign \
            --define "_gpg_name $key_id" \
            --define "__gpg_sign_cmd %{__gpg} gpg --batch --no-verbose --no-armor --pinentry-mode loopback --passphrase-file $pass_file --no-secmem-warning -u %{_gpg_name} -sbo %{__signature_filename} --digest-algo sha256 %{__plaintext_filename}" \
            "$RPM_PATH"
          shred -u "$pass_file"
          # export the public key for the repo's gpgkey=
          gpg --armor --export "$key_id" > RPM-GPG-KEY-music-caster
          echo 'SIGNED=true' >> "$GITHUB_ENV"

      - name: Verify the RPM signature
        if: ${{ env.RPM_GPG_PRIVATE_KEY != '' }}
        run: |
          set -eux
          rpm --import RPM-GPG-KEY-music-caster
          # --checksig reports NOKEY/NOT OK unless the signature verifies
          rpm --checksig -v "$RPM_PATH" | tee /dev/stderr | grep -qi 'Signature.*OK\|pgp.*OK'

      # catches an unsatisfiable dependency, a missing sidecar or a bad .desktop.
      # gpgcheck follows SIGNED, so when signing is on this also proves the
      # signature satisfies dnf itself and not just gpg.
      - name: Verify the RPM installs
        run: |
          set -eux
          dnf install -y --setopt=localpkg_gpgcheck="${SIGNED:-false}" "$RPM_PATH"
          # read the name back off the package: Tauri derives it from productName,
          # so it is "Music Caster", not the file-safe "music-caster"
          pkg_name=$(rpm -qp --queryformat '%{NAME}' "$RPM_PATH")
          rpm -ql "$pkg_name" | grep -i 'music-caster-daemon' \
            || { echo "::error::daemon sidecar is missing from the RPM"; exit 1; }
          for desktop in /usr/share/applications/*[Mm]usic*[Cc]aster*.desktop; do
            desktop-file-validate "$desktop"
          done

      - name: Upload RPM
        uses: actions/upload-artifact@main
        with:
          name: Music Caster Fedora RPM
          path: app/src-tauri/target/${{ env.TARGET_TRIPLE }}/release/bundle/rpm/*.rpm
          if-no-files-found: error

      # separate artifact: this is the same key every run and belongs at the
      # repo's gpgkey= URL, not attached to each GitHub release
      - name: Upload public key
        if: ${{ env.RPM_GPG_PRIVATE_KEY != '' }}
        uses: actions/upload-artifact@main
        with:
          name: RPM GPG public key
          path: RPM-GPG-KEY-music-caster
          if-no-files-found: error

  # Sign the Tauri-built MSI (and the NSIS installer, which ships alongside it)
  # on a Linux runner. sign_updater regenerates the Tauri updater *.msi.sig over
  # the Authenticode-signed MSI (the .sig tauri-action produced covers the
  # unsigned bytes and would fail updater verification), so the authoritative
  # .sig lives in the windows-msi-<arch> artifact and, from there, on the release.
  sign-installers:
    needs: [release]
    if: ${{ github.ref == 'refs/heads/master' || github.ref_type == 'tag' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    uses: ./.github/workflows/codesign.yml
    secrets: inherit
    with:
      download_artifact: installers-unsigned-${{ matrix.arch }}
      upload_artifact: windows-msi-${{ matrix.arch }}
      clobber_release: true
      sign_updater: true

  merge-windows-artifacts:
    runs-on: ubuntu-latest
    needs:
      - sign-bootstrapper
      - sign-installers
    steps:
      - uses: actions/upload-artifact/merge@main
        with:
          name: Music Caster Windows Installers
          pattern: windows-*
          delete-merged: true

  # Tag and publish v<version> with the SIGNED installers once everything is built and
  # signed. Only runs on master and only when the app version is ahead of the latest
  # release; the tag is created by `gh release create` at the commit that was built.
  publish-release:
    runs-on: ubuntu-latest
    needs: [changelog, merge-windows-artifacts, build-rpm]
    if: >-
      ${{ !cancelled()
      && github.ref == 'refs/heads/master'
      && needs.changelog.result == 'success'
      && needs.changelog.outputs.should_release == 'true'
      && needs.merge-windows-artifacts.result == 'success' }}
    permissions:
      contents: write
    steps:
      - name: Download signed installers
        uses: actions/download-artifact@main
        with:
          name: Music Caster Windows Installers
          path: release-assets

      - name: Download Fedora RPM
        if: ${{ needs.build-rpm.result == 'success' }}
        uses: actions/download-artifact@main
        with:
          name: Music Caster Fedora RPM
          path: release-assets

      - name: Warn that the Fedora RPM is missing
        if: ${{ needs.build-rpm.result != 'success' }}
        run: |
          echo "::warning::build-rpm result was '${{ needs.build-rpm.result }}'; publishing this release WITHOUT the Fedora RPM"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.changelog.outputs.version }}
          NOTES: ${{ needs.changelog.outputs.changelog }}
        run: |
          set -euo pipefail
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.txt has no changes for $TAG; refusing to publish a release with an empty body"
            exit 1
          fi
          printf '%s\n' "$NOTES" > release_notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            # a previous run got part way through; replace its assets and body
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --title "Music Caster $TAG" --notes-file release_notes.md --draft=false --latest
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Music Caster $TAG" \
              --notes-file release_notes.md --latest release-assets/*
          fi
